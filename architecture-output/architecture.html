<style>

</style>

// HTML-escape any string interpolated into innerHTML. All node/layer data comes
// from local Cargo.toml/filesystem (trusted), but escape defensively.
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function num(n) { return Number(n || 0).toLocaleString(); }

const LAYER_COLOR = Object.fromEntries(DATA.layers.map(l => [l.name, l.color]));
const NODES = DATA.components;
const EDGES = DATA.relationships;
const NODE_BY_ID = Object.fromEntries(NODES.map(n => [n.id, n]));

// ----- header stats -----
const statsEl = document.getElementById('stats');

function strong(text) { const b = document.createElement('b'); b.textContent = text; return b; }
statsFrag.append(strong(num(DATA.stats.rust_crates)), ' crates · ',
  strong(num(DATA.stats.total_rust_loc)), ' LoC · ',

  strong(num(DATA.stats.internal_edges)), ' internal deps');
statsEl.appendChild(statsFrag);

// ----- sidebar: layer toggles -----
const layerStates = Object.fromEntries(DATA.layers.map(l => [l.name, true]));
function renderLayerToggles() {
  const root = document.getElementById('layerToggles');
  root.textContent = '';
  DATA.layers.forEach(layer => {
    const el = document.createElement('div');
    el.className = 'layer-toggle' + (layerStates[layer.name] ? '' : ' off');
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = layer.color;
    const lbl = document.createElement('span');
    lbl.textContent = layer.name;
    const cnt = document.createElement('span');
    cnt.className = 'count';
    cnt.textContent = String(layer.size);
    el.append(dot, lbl, cnt);
    el.onclick = () => { layerStates[layer.name] = !layerStates[layer.name]; renderLayerToggles(); applyFilter(); };
    root.appendChild(el);
  });
}
renderLayerToggles();

// ----- sidebar: entry points -----
(function renderEntries(){
  const entryList = document.getElementById('entryList');
  DATA.entry_points.forEach(ep => {
    const a = document.createElement('a');
    a.className = 'layer-toggle';
    a.style.cursor = 'pointer';
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = LAYER_COLOR[NODE_BY_ID[ep.crate]?.layer] || '#64748b';
    const lbl = document.createElement('span');
    lbl.textContent = ep.name;
    a.append(dot, lbl);
    a.onclick = () => {
      const target = NODE_BY_ID[ep.crate];
      if (target) {
        document.querySelector('.modes button[data-mode="graph"]').click();
        setTimeout(() => selectNode(target), 50);
      }
    };
    entryList.appendChild(a);
  });
})();

// ----- welcome screen content (set as initial detail) -----
function renderWelcome() {
  const detail = document.getElementById('detail');
  detail.textContent = '';
  const wrap = document.createElement('div');
  wrap.className = 'empty-hint';
  const h = document.createElement('h2'); h.style.marginTop = '0'; h.textContent = 'Welcome'; wrap.appendChild(h);
  const p1 = document.createElement('p'); p1.textContent = 'Click any layer or crate to see its role, dependencies, and where to find it.'; wrap.appendChild(p1);

  const h2 = document.createElement('h3'); h2.textContent = 'Modes'; wrap.appendChild(h2);
  const ul = document.createElement('ul'); ul.style.paddingLeft = '18px'; ul.style.lineHeight = '1.6';
  const li1 = document.createElement('li'); li1.innerHTML = '<b>Layers</b> &mdash; high-level boxes per architectural layer. Click a layer for its purpose and members.'; ul.appendChild(li1);
  const li2 = document.createElement('li'); li2.innerHTML = '<b>Crate graph</b> &mdash; force-directed dependency graph across all 112 Rust crates. Toggle layers in the sidebar.'; ul.appendChild(li2);
  wrap.appendChild(ul);

  const h3 = document.createElement('h3'); h3.textContent = 'Key patterns'; wrap.appendChild(h3);
  DATA.patterns.forEach(p => {
    const card = document.createElement('div'); card.className = 'pattern-card';
    const b = document.createElement('b'); b.textContent = p.name; card.appendChild(b);
    const body = document.createElement('div'); body.style.marginTop = '4px'; body.textContent = p.summary; card.appendChild(body);
    const where = document.createElement('div'); where.className = 'where'; where.textContent = '\u{1F4C1} ' + p.where; card.appendChild(where);
    wrap.appendChild(card);
  });

  const h4 = document.createElement('h3'); h4.textContent = 'Where to start'; wrap.appendChild(h4);
  const p2 = document.createElement('p'); p2.innerHTML = 'Read <code>AGENTS.md</code> at the repo root &mdash; it has dozens of binding conventions (formatting, lints, test discipline, do-not-touch zones).'; wrap.appendChild(p2);
  detail.appendChild(wrap);
}

// ----- search -----
let searchTerm = '';
document.getElementById('search').oninput = (e) => { searchTerm = e.target.value.toLowerCase().trim(); applyFilter(); };

// ----- mode switching -----
let currentMode = 'layers';
document.querySelectorAll('.modes button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    selectedNode = null;
    renderWelcome();
    render();
  };
});

// ----- D3 setup -----
const svg = d3.select('#canvas');
let width = 0, height = 0;
let zoomG, linksG, nodesG;
let simulation = null;
let selectedNode = null;

function setupSvg() {
  svg.selectAll('*').remove();
  zoomG = svg.append('g');
  linksG = zoomG.append('g').attr('class', 'links');
  nodesG = zoomG.append('g').attr('class', 'nodes');
  svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', (e) => zoomG.attr('transform', e.transform)));
  const r = svg.node().getBoundingClientRect();
  width = r.width; height = r.height;
}

function applyFilter() {
  if (currentMode === 'graph' && nodesG) {
    nodesG.selectAll('.node').classed('dimmed', d => {
      if (!layerStates[d.layer]) return true;
      if (searchTerm && !d.id.toLowerCase().includes(searchTerm)) return true;
      return false;
    });
    linksG.selectAll('.link').classed('dimmed', d => {
      const s = NODE_BY_ID[d.source.id || d.source];
      const t = NODE_BY_ID[d.target.id || d.target];
      if (!s || !t) return true;
      return !layerStates[s.layer] || !layerStates[t.layer];
    });
  }
}

function showNodeDetail(node) {
  const inDeps = NODES.filter(n => (n.deps || []).includes(node.id)).map(n => n.id);
  const outDeps = (node.deps || []).filter(d => NODE_BY_ID[d]);
  const layerColor = LAYER_COLOR[node.layer] || '#64748b';
  const detail = document.getElementById('detail');
  detail.textContent = '';
  const root = document.createElement('div');

  const pill = document.createElement('span'); pill.className = 'layer-pill'; pill.style.background = layerColor; pill.textContent = node.layer; root.appendChild(pill);
  const h = document.createElement('h2'); h.textContent = node.name; root.appendChild(h);
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.append(node.kind + ' · ');
  const code = document.createElement('code'); code.textContent = node.rel_path || node.id; meta.appendChild(code);
  root.appendChild(meta);
  const summary = document.createElement('div'); summary.className = 'summary'; summary.textContent = node.summary; root.appendChild(summary);

  if (node.lines) {
    const grid = document.createElement('div'); grid.className = 'stat-grid';
    const mkStat = (val, lbl) => {
      const d = document.createElement('div');
      const b = document.createElement('b'); b.textContent = num(val); d.appendChild(b);
      const s = document.createElement('span'); s.textContent = lbl; d.appendChild(s);
      return d;
    };
    grid.appendChild(mkStat(node.lines, 'Lines of Rust'));
    grid.appendChild(mkStat(node.file_count, 'Source files'));
    grid.appendChild(mkStat(outDeps.length, 'Depends on'));
    grid.appendChild(mkStat(inDeps.length, 'Depended on by'));
    root.appendChild(grid);
  }
  if (node.has_bin) {
    const tip = document.createElement('p'); tip.className = 'tip'; tip.textContent = '\u{1F4E6} Ships a binary.'; root.appendChild(tip);
  }
  if (node.key_files && node.key_files.length) {
    const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'Largest source files'; root.appendChild(st);
    const ul = document.createElement('ul');
    node.key_files.forEach(f => {
      const li = document.createElement('li');
      const c = document.createElement('code'); c.textContent = f; li.appendChild(c);
      ul.appendChild(li);
    });
    root.appendChild(ul);
  }

  const mkDepList = (title, ids, prefix) => {
    const st = document.createElement('div'); st.className = 'section-title'; st.textContent = `${title} (${ids.length})`; root.appendChild(st);
    const list = document.createElement('div'); list.className = 'dep-list';
    if (ids.length === 0) {
      const none = document.createElement('div'); none.className = 'none';
      none.textContent = title === 'Depends on' ? '(no internal deps)' : '(nothing depends on this)';
      list.appendChild(none);
    } else {
      ids.forEach(d => {
        const a = document.createElement('a'); a.textContent = `${prefix} ${d}`;
        a.onclick = () => { const t = NODE_BY_ID[d]; if (t) selectNode(t); };
        list.appendChild(a);
      });
    }
    root.appendChild(list);
  };
  mkDepList('Depends on', outDeps, '→');
  mkDepList('Depended on by', inDeps, '←');
  detail.appendChild(root);
}

function showLayerDetail(layer) {
  const members = NODES.filter(n => n.layer === layer.name);
  const totalLoc = members.reduce((a, m) => a + (m.lines || 0), 0);
  const detail = document.getElementById('detail');
  detail.textContent = '';
  const root = document.createElement('div');
  const pill = document.createElement('span'); pill.className = 'layer-pill'; pill.style.background = layer.color; pill.textContent = layer.name; root.appendChild(pill);
  const h = document.createElement('h2'); h.style.marginTop = '6px'; h.textContent = `${layer.size} components`; root.appendChild(h);
  const summary = document.createElement('div'); summary.className = 'summary'; summary.textContent = layer.purpose; root.appendChild(summary);

  const grid = document.createElement('div'); grid.className = 'stat-grid';
  const mkStat = (val, lbl) => {
    const d = document.createElement('div');
    const b = document.createElement('b'); b.textContent = num(val); d.appendChild(b);
    const s = document.createElement('span'); s.textContent = lbl; d.appendChild(s);
    return d;
  };
  grid.appendChild(mkStat(layer.size, 'Components'));
  grid.appendChild(mkStat(totalLoc, 'Total LoC'));
  root.appendChild(grid);

  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'Members'; root.appendChild(st);
  const list = document.createElement('div'); list.className = 'dep-list';
  members.sort((a,b) => (b.lines || 0) - (a.lines || 0)).forEach(m => {
    const a = document.createElement('a');
    a.textContent = m.name;
    if (m.lines) {
      const span = document.createElement('span'); span.style.color = 'var(--fg-dim)'; span.style.fontSize = '10px';
      span.textContent = ` · ${num(m.lines)} LoC`;
      a.appendChild(span);
    }
    a.onclick = () => {
      const t = NODE_BY_ID[m.id];
      if (t) {
        document.querySelector('.modes button[data-mode="graph"]').click();
        setTimeout(() => selectNode(t), 50);
      }
    };
    list.appendChild(a);
  });
  root.appendChild(list);
  detail.appendChild(root);
}

function selectNode(node) {
  selectedNode = node;
  if (currentMode === 'graph' && nodesG) {
    nodesG.selectAll('.node').classed('selected', d => d.id === node.id);
    const neighbors = new Set([node.id]);
    EDGES.forEach(e => {
      const s = e.source.id || e.source;
      const t = e.target.id || e.target;
      if (s === node.id) neighbors.add(t);
      if (t === node.id) neighbors.add(s);
    });
    nodesG.selectAll('.node').classed('dimmed', d => !neighbors.has(d.id)).classed('label-visible', d => neighbors.has(d.id));
    linksG.selectAll('.link')
      .classed('highlight', d => (d.source.id === node.id || d.target.id === node.id))
      .classed('dimmed', d => !(d.source.id === node.id || d.target.id === node.id));
  }
  showNodeDetail(node);
}

// ----- Graph mode -----
function renderGraph() {
  setupSvg();
  const visible = NODES;
  const links = EDGES.map(e => ({ source: e.source, target: e.target }));

  const inCount = {};
  EDGES.forEach(e => { const t = typeof e.target === 'string' ? e.target : e.target.id; inCount[t] = (inCount[t] || 0) + 1; });

  simulation = d3.forceSimulation(visible.map(d => ({ ...d })))
    .force('link', d3.forceLink(links).id(d => d.id).distance(50).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-90))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collide', d3.forceCollide().radius(d => 4 + Math.sqrt((inCount[d.id] || 0) + 1) * 2.5));

  const link = linksG.selectAll('.link').data(links).enter()
    .append('line').attr('class', 'link');

  const node = nodesG.selectAll('.node').data(simulation.nodes()).enter()
    .append('g').attr('class', 'node');
  node.append('circle')
    .attr('r', d => 4 + Math.sqrt((inCount[d.id] || 0) + 1) * 2)
    .attr('fill', d => LAYER_COLOR[d.layer] || '#64748b')
    .on('click', (e, d) => { e.stopPropagation(); selectNode(d); });
  node.append('text').attr('dy', -10).text(d => d.id.replace('codex-', ''));
  node.on('mouseover', function() { d3.select(this).classed('label-visible', true); })
      .on('mouseout', function(e, d) {
        if (!selectedNode || selectedNode.id !== d.id) d3.select(this).classed('label-visible', false);
      });

  svg.on('click', () => {
    selectedNode = null;
    nodesG.selectAll('.node').classed('selected', false).classed('dimmed', false).classed('label-visible', false);
    linksG.selectAll('.link').classed('highlight', false).classed('dimmed', false);
    renderWelcome();
    applyFilter();
  });

  node.call(d3.drag()
    .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
    .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  applyFilter();
}

// ----- Layer mode -----
function renderLayers() {
  setupSvg();
  const layers = DATA.layers;
  const cols = 4;
  const cardW = Math.max(220, (width - 80) / cols);
  const cardH = 130;
  const gapX = 16, gapY = 22;
  const startX = (width - (cols * cardW + (cols - 1) * gapX)) / 2;
  const startY = 40;

  const positions = {};
  layers.forEach((layer, i) => {
    const row = Math.floor(i / cols), col = i % cols;
    positions[layer.name] = { x: startX + col * (cardW + gapX), y: startY + row * (cardH + gapY), w: cardW, h: cardH };
  });

  const layerEdges = {};
  EDGES.forEach(e => {
    const s = NODE_BY_ID[e.source]?.layer;
    const t = NODE_BY_ID[e.target]?.layer;
    if (!s || !t || s === t) return;
    const k = s + '|' + t;
    layerEdges[k] = (layerEdges[k] || 0) + 1;
  });

  Object.entries(layerEdges).forEach(([k, count]) => {
    if (count < 3) return;
    const [a, b] = k.split('|');
    const pa = positions[a], pb = positions[b];
    if (!pa || !pb) return;
    linksG.append('line')
      .attr('class', 'layer-link')
      .attr('x1', pa.x + pa.w / 2).attr('y1', pa.y + pa.h / 2)
      .attr('x2', pb.x + pb.w / 2).attr('y2', pb.y + pb.h / 2)
      .attr('stroke-width', Math.min(4, 0.5 + count / 8))
      .attr('stroke-opacity', 0.35);
  });

  layers.forEach(layer => {
    const p = positions[layer.name];
    const g = nodesG.append('g').attr('transform', `translate(${p.x},${p.y})`).style('cursor', 'pointer');
    g.append('rect').attr('class', 'layer-card').attr('width', p.w).attr('height', p.h);
    g.append('rect').attr('class', 'layer-card-bar')
      .attr('x', 10).attr('y', 10).attr('width', 28).attr('height', 4).attr('fill', layer.color);
    g.append('text').attr('class', 'layer-card-title').attr('x', 14).attr('y', 36).text(layer.name);
    g.append('text').attr('class', 'layer-card-meta').attr('x', 14).attr('y', 54).text(`${layer.size} components`);
    const members = NODES.filter(n => n.layer === layer.name).sort((a,b) => (b.lines||0) - (a.lines||0)).slice(0, 6);
    members.forEach((m, i) => {
      const y = 72 + (i % 3) * 14;
      const x = 14 + (i >= 3 ? p.w / 2 - 14 : 0);
      g.append('text').attr('class', 'layer-card-meta').attr('x', x).attr('y', y)
        .text('· ' + m.id.replace('codex-', '').slice(0, 22))
        .style('font-family', 'ui-monospace, monospace');
    });
    g.on('click', (e) => { e.stopPropagation(); showLayerDetail(layer); });
  });

  svg.on('click', () => { renderWelcome(); });
}

function render() {
  if (currentMode === 'layers') renderLayers();
  else renderGraph();
}

window.addEventListener('resize', () => render());
renderWelcome();
render();
</script>
</body>
</html>
